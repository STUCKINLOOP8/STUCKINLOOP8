<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 280" width="100%" height="280">
      <defs>
        <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="#161b22" />
        </pattern>

        <style>
          /* 1. Color Cycling via hue-rotate on container */
          @keyframes cycle-colors {
            0%, 100% { filter: hue-rotate(0deg); }       /* Pure Matrix Green */
            25% { filter: hue-rotate(270deg); }          /* Cyber Yellow / Amber */
            50% { filter: hue-rotate(220deg); }          /* Cyber Red */
            75% { filter: hue-rotate(160deg); }          /* Neon Pink / Magenta */
          }

          /* 2. Cyber Glitch Shake */
          @keyframes glitch-shake {
            0%, 38%, 42%, 82%, 87%, 92%, 97%, 100% { transform: translate(0, 0); }
            39% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            41% { transform: translate(-1px, 0); }
            83% { transform: translate(-4px, 1px); }
            84% { transform: translate(3px, -2px); }
            85% { transform: translate(-3px, 2px); }
            86% { transform: translate(4px, 0); }
            88% { transform: translate(-2px, -1px); }
            89% { transform: translate(3px, 1px); }
            90% { transform: translate(-4px, 0); }
            93% { transform: translate(2px, 1px); }
            94% { transform: translate(-1px, -1px); }
            95% { transform: translate(3px, 0); }
          }

          /* 3. Ghost Glitch Layer */
          @keyframes glitch-ghost {
            0%, 82%, 96%, 100% { opacity: 0; transform: translate(0, 0); }
            83% { opacity: 0.85; transform: translate(-6px, 1px); filter: hue-rotate(90deg); }
            85% { opacity: 0.4; transform: translate(5px, -2px); filter: hue-rotate(180deg); }
            88% { opacity: 0.9; transform: translate(-5px, 2px); filter: hue-rotate(90deg); }
            90% { opacity: 0.2; transform: translate(3px, 0); }
            93% { opacity: 0.75; transform: translate(5px, 1px); filter: hue-rotate(240deg); }
          }

          .color-cycle-layer {
            animation: cycle-colors 10s infinite linear;
          }

          .glitch-target {
            animation: glitch-shake 4s infinite ease-in-out;
          }

          .glitch-ghost-layer {
            animation: glitch-ghost 4s infinite ease-in-out;
          }

          /* 4. LED Pulse Keyframes */
          @keyframes tick-pulse {
            0% {
              fill: #ffffff;
              opacity: 1;
              filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 12px #00ff66) drop-shadow(0 0 22px #00ff66);
            }
            4% {
              fill: #66ff99;
              opacity: 1;
              filter: drop-shadow(0 0 4px #00ff66) drop-shadow(0 0 14px #00ff66);
            }
            8% {
              fill: #00ff66;
              opacity: 1;
              filter: drop-shadow(0 0 3px #00ff66) drop-shadow(0 0 10px #00ff66);
            }
            12% {
              fill: #00dd55;
              opacity: 0.9;
              filter: drop-shadow(0 0 2px #00cc55);
            }
            16% {
              fill: #00bb44;
              opacity: 0.75;
            }
            20% {
              fill: #008833;
              opacity: 0.55;
            }
            24% {
              fill: #005522;
              opacity: 0.35;
            }
            28% {
              fill: #003311;
              opacity: 0.2;
            }
            32%, 100% {
              fill: #00ff66;
              opacity: 0.07;
              filter: none;
            }
          }

          .tick {
            fill: #00ff66;
            opacity: 0.07;
            animation: tick-pulse 3.6s infinite linear;
          }

          /* Delays */
          .tk-0 { animation-delay: 0.000s; }
          .tk-1 { animation-delay: 0.100s; }
          .tk-2 { animation-delay: 0.200s; }
          .tk-3 { animation-delay: 0.300s; }
          .tk-4 { animation-delay: 0.400s; }
          .tk-5 { animation-delay: 0.500s; }
          .tk-6 { animation-delay: 0.600s; }
          .tk-7 { animation-delay: 0.700s; }
          .tk-8 { animation-delay: 0.800s; }
          .tk-9 { animation-delay: 0.900s; }
          .tk-10 { animation-delay: 1.000s; }
          .tk-11 { animation-delay: 1.100s; }
          .tk-12 { animation-delay: 1.200s; }
          .tk-13 { animation-delay: 1.300s; }
          .tk-14 { animation-delay: 1.400s; }
          .tk-15 { animation-delay: 1.500s; }
          .tk-16 { animation-delay: 1.600s; }
          .tk-17 { animation-delay: 1.700s; }
          .tk-18 { animation-delay: 1.800s; }
          .tk-19 { animation-delay: 1.900s; }
          .tk-20 { animation-delay: 2.000s; }
          .tk-21 { animation-delay: 2.100s; }
          .tk-22 { animation-delay: 2.200s; }
          .tk-23 { animation-delay: 2.300s; }
          .tk-24 { animation-delay: 2.400s; }
          .tk-25 { animation-delay: 2.500s; }
          .tk-26 { animation-delay: 2.600s; }
          .tk-27 { animation-delay: 2.700s; }
          .tk-28 { animation-delay: 2.800s; }
          .tk-29 { animation-delay: 2.900s; }
          .tk-30 { animation-delay: 3.000s; }
          .tk-31 { animation-delay: 3.100s; }
          .tk-32 { animation-delay: 3.200s; }
          .tk-33 { animation-delay: 3.300s; }
          .tk-34 { animation-delay: 3.400s; }
          .tk-35 { animation-delay: 3.500s; }

          .title-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
            font-weight: 800;
            letter-spacing: 3.5px;
            font-size: 15px;
            fill: #e6edf3;
          }
          .sub-text {
            font-family: Consolas, "Courier New", "Fira Code", monospace;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 600;
            fill: #8b949e;
          }
          .code-pill-font {
            font-family: Consolas, "Courier New", monospace;
            font-weight: 700;
            font-size: 11px;
          }
        </style>
      </defs>

      <rect width="850" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <rect width="850" height="280" rx="14" fill="url(#grid-dots)" opacity="0.6" />

      <!-- Fixed Base Code Pill Background -->
      <g transform="translate(325, 244)">
        <rect width="200" height="22" rx="11" fill="#161b22" />
      </g>

      <!-- Color Cycler Wrapper -->
      <g class="color-cycle-layer">
        <!-- Glitch Shake Wrapper -->
        <g class="glitch-target">
          <!-- Main Snake Track -->
          <g id="led-track">
            <rect x="421.2" y="95.5" width="7.5" height="19" rx="2.5" class="tick tk-0" />
            <rect x="443.4" y="80.0" width="7.5" height="19" rx="2.5" class="tick tk-1" />
            <rect x="465.9" y="65.1" width="7.5" height="19" rx="2.5" class="tick tk-2" />
            <rect x="489.1" y="51.2" width="7.5" height="19" rx="2.5" class="tick tk-3" />
            <rect x="513.4" y="39.4" width="7.5" height="19" rx="2.5" class="tick tk-4" />
            <rect x="539.1" y="31.7" width="7.5" height="19" rx="2.5" class="tick tk-5" />
            <rect x="566.0" y="32.1" width="7.5" height="19" rx="2.5" class="tick tk-6" />
            <rect x="588.9" y="45.7" width="7.5" height="19" rx="2.5" class="tick tk-7" />
            <rect x="602.1" y="68.9" width="7.5" height="19" rx="2.5" class="tick tk-8" />
            <rect x="606.2" y="95.5" width="7.5" height="19" rx="2.5" class="tick tk-9" />
            <rect x="602.1" y="122.1" width="7.5" height="19" rx="2.5" class="tick tk-10" />
            <rect x="588.9" y="145.3" width="7.5" height="19" rx="2.5" class="tick tk-11" />
            <rect x="566.0" y="158.9" width="7.5" height="19" rx="2.5" class="tick tk-12" />
            <rect x="539.1" y="159.3" width="7.5" height="19" rx="2.5" class="tick tk-13" />
            <rect x="513.4" y="151.6" width="7.5" height="19" rx="2.5" class="tick tk-14" />
            <rect x="489.1" y="139.8" width="7.5" height="19" rx="2.5" class="tick tk-15" />
            <rect x="465.9" y="125.9" width="7.5" height="19" rx="2.5" class="tick tk-16" />
            <rect x="443.4" y="111.0" width="7.5" height="19" rx="2.5" class="tick tk-17" />
            <rect x="421.2" y="95.5" width="7.5" height="19" rx="2.5" class="tick tk-18" />
            <rect x="399.1" y="80.0" width="7.5" height="19" rx="2.5" class="tick tk-19" />
            <rect x="376.6" y="65.1" width="7.5" height="19" rx="2.5" class="tick tk-20" />
            <rect x="353.4" y="51.2" width="7.5" height="19" rx="2.5" class="tick tk-21" />
            <rect x="329.1" y="39.4" width="7.5" height="19" rx="2.5" class="tick tk-22" />
            <rect x="303.4" y="31.7" width="7.5" height="19" rx="2.5" class="tick tk-23" />
            <rect x="276.6" y="32.1" width="7.5" height="19" rx="2.5" class="tick tk-24" />
            <rect x="253.6" y="45.7" width="7.5" height="19" rx="2.5" class="tick tk-25" />
            <rect x="240.3" y="68.9" width="7.5" height="19" rx="2.5" class="tick tk-26" />
            <rect x="236.2" y="95.5" width="7.5" height="19" rx="2.5" class="tick tk-27" />
            <rect x="240.3" y="122.1" width="7.5" height="19" rx="2.5" class="tick tk-28" />
            <rect x="253.6" y="145.3" width="7.5" height="19" rx="2.5" class="tick tk-29" />
            <rect x="276.6" y="158.9" width="7.5" height="19" rx="2.5" class="tick tk-30" />
            <rect x="303.4" y="159.3" width="7.5" height="19" rx="2.5" class="tick tk-31" />
            <rect x="329.1" y="151.6" width="7.5" height="19" rx="2.5" class="tick tk-32" />
            <rect x="353.4" y="139.8" width="7.5" height="19" rx="2.5" class="tick tk-33" />
            <rect x="376.6" y="125.9" width="7.5" height="19" rx="2.5" class="tick tk-34" />
            <rect x="399.1" y="111.0" width="7.5" height="19" rx="2.5" class="tick tk-35" />
          </g>

          <!-- Chromatic Ghost Layer during Glitch -->
          <use href="#led-track" class="glitch-ghost-layer" />

          <!-- Dynamic Status Pill -->
          <g transform="translate(325, 244)">
            <rect width="200" height="22" rx="11" fill="none" stroke="#00ff66" stroke-width="1.2" opacity="0.8" />
            <text x="100" y="15" fill="#00ff66" class="code-pill-font" text-anchor="middle" filter="drop-shadow(0 0 4px #00ff66)">while (alive) { code(); }</text>
          </g>
        </g>
      </g>

      <!-- Typography Overlay -->
      <g>
        <text x="425" y="212" text-anchor="middle" class="title-text">STUCKINLOOP8</text>
        <text x="425" y="230" text-anchor="middle" class="sub-text">COMPUTER SCIENCE &amp; APPLIED MATHEMATICS // ASPIRING QUANT // UNDERGRAD</text>
      </g>
    </svg>