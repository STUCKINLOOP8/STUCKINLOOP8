  <!-- Central Black Hole Singularity & Event Horizon (Pure Pitch Black Core) -->
  <g>
    <!-- Radiant Photon Ring Glow -->
    <circle cx="440" cy="205" r="54" fill="url(#singularityGlow)"/>
    <!-- Event Horizon Stark Shadow Edge -->
    <circle cx="440" cy="205" r="42" fill="#000000" stroke="#00d4ff" stroke-width="1.8" filter="url(#shadowFilter)"/>
    <circle cx="440" cy="205" r="39" fill="#000000"/>
    
    <!-- Inner Singularity Infinity Glyph (Loop 8) -->
