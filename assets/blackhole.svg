  <!-- Command Prompt -->
  <text x="84" y="22.5" font-family="ui-monospace, monospace" font-size="13">
    <tspan fill="#7ee787" font-weight="bold">$</tspan>
    <tspan fill="#f0f6fc"> gravity --singularity-infall --loop=8</tspan>
  </text>

  <!-- Right Side Status Badge -->
  <g transform="translate(720, 8.5)">
    <rect width="144" height="20" rx="10" fill="#0d1117" stroke="#00d4ff" stroke-width="0.8"/>
    <circle cx="11" cy="10" r="3.5" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="21" y="14" fill="#00d4ff" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.4">singularity: active</text>
  </g>

  <!-- Subtle Distant Stars -->
  <g opacity="0.4">
    <circle cx="90" cy="65" r="1" fill="#ffffff"/>
    <circle cx="210" cy="110" r="1.2" fill="#00d4ff"/>
    <circle cx="770" cy="85" r="1.5" fill="#ffffff"/>
    <circle cx="830" cy="290" r="1" fill="#7928ca"/>
    <circle cx="110" cy="320" r="1.3" fill="#ffffff"/>
    <circle cx="690" cy="330" r="1" fill="#00ff88"/>
    <circle cx="440" cy="55" r="1.2" fill="#ffffff"/>
    <circle cx="330" cy="360" r="1" fill="#00d4ff"/>
  </g>

  <!-- Ambient Accretion Glow -->
  <circle cx="440" cy="205" r="310" fill="url(#accretionBackGlow)"/>

  <!-- Relativistic Polar Jet Beams -->
  <g opacity="0.35">
    <path d="M439 205L425 36H455L441 205Z" fill="url(#accretionBackGlow)"/>
    <path d="M439 205L425 380H455L441 205Z" fill="url(#accretionBackGlow)"/>
    <line x1="440" y1="40" x2="440" y2="375" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  </g>

  <!-- Gravitational Lensing Halo (Over the top, Gargantua style) -->
  <g class="halo-pulse">
    <ellipse cx="440" cy="205" rx="105" ry="115" stroke="url(#diskGrad)" stroke-width="3" fill="none" opacity="0.65" filter="url(#shadowFilter)"/>
    <ellipse cx="440" cy="205" rx="125" ry="135" stroke="#00d4ff" stroke-width="1" stroke-dasharray="12 18" fill="none" opacity="0.4"/>
  </g>

  <!-- Main Accretion Disk Rings (Projected / Tilted 3D Ellipses) -->
  <g transform="translate(440, 205) rotate(-12) translate(-440, -205)">
    <!-- Outer Dust Rings -->
    <ellipse cx="440" cy="205" rx="360" ry="75" stroke="#30363d" stroke-width="1" stroke-dasharray="4 8" fill="none" opacity="0.5"/>
    <ellipse cx="440" cy="205" rx="300" ry="60" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="8 12" fill="none" opacity="0.35"/>
    
    <!-- Mid Glowing Accretion Ring -->
    <ellipse cx="440" cy="205" rx="220" ry="44" stroke="url(#diskGrad)" stroke-width="2.5" fill="none" opacity="0.75" filter="url(#shadowFilter)"/>
    
    <!-- Inner Photon Orbit Ring -->
    <ellipse cx="440" cy="205" rx="130" ry="26" stroke="#00ff88" stroke-width="3" fill="none" opacity="0.9" filter="url(#shadowFilter)"/>
    <ellipse cx="440" cy="205" rx="80" ry="16" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Swirling Infall Gravitational Layer for Tech Labels -->
  <g transform="translate(440, 205) scale(1, 0.44) rotate(-12)">
          <!-- Skill 1: Python -->
          <g class="s-1">
            <g class="c-1">
              <rect x="-35.0" y="-13" width="70" height="24" rx="12" class="tag-pill" stroke="#00d4ff"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#00d4ff">Python</text>
            </g>
          </g>
          <!-- Skill 2: C++ -->
          <g class="s-2">
            <g class="c-2">
              <rect x="-26.0" y="-13" width="52" height="24" rx="12" class="tag-pill" stroke="#00d4ff"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#00d4ff">C++</text>
            </g>
          </g>
          <!-- Skill 3: NumPy & Pandas -->
          <g class="s-3">
            <g class="c-3">
              <rect x="-65.0" y="-13" width="130" height="24" rx="12" class="tag-pill" stroke="#00ff88"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#00ff88">NumPy &amp; Pandas</text>
            </g>
          </g>
          <!-- Skill 4: MATLAB -->
          <g class="s-4">
            <g class="c-4">
              <rect x="-36.0" y="-13" width="72" height="24" rx="12" class="tag-pill" stroke="#ff7b72"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#ff7b72">MATLAB</text>
            </g>
          </g>
          <!-- Skill 5: SQL -->
          <g class="s-5">
            <g class="c-5">
              <rect x="-25.0" y="-13" width="50" height="24" rx="12" class="tag-pill" stroke="#79c0ff"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#79c0ff">SQL</text>
            </g>
          </g>
          <!-- Skill 6: Probability & Stats -->
          <g class="s-6">
            <g class="c-6">
              <rect x="-70.0" y="-13" width="140" height="24" rx="12" class="tag-pill" stroke="#00ff88"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#00ff88">Probability &amp; Stats</text>
            </g>
          </g>
          <!-- Skill 7: Docker -->
          <g class="s-7">
            <g class="c-7">
              <rect x="-32.0" y="-13" width="64" height="24" rx="12" class="tag-pill" stroke="#bc8cff"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#bc8cff">Docker</text>
            </g>
          </g>
          <!-- Skill 8: Linear Algebra -->
          <g class="s-8">
            <g class="c-8">
              <rect x="-55.0" y="-13" width="110" height="24" rx="12" class="tag-pill" stroke="#00ff88"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#00ff88">Linear Algebra</text>
            </g>
          </g>
          <!-- Skill 9: Stochastic Calculus -->
          <g class="s-9">
