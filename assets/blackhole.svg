            <g class="c-11">
              <rect x="-24.0" y="-13" width="48" height="24" rx="12" class="tag-pill" stroke="#00ff88"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#00ff88">DSA</text>
            </g>
          </g>
          <!-- Skill 12: TypeScript -->
