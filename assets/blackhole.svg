            <g class="c-16">
              <rect x="-67.0" y="-13" width="134" height="24" rx="12" class="tag-pill" stroke="#bc8cff"/>
              <text x="0" y="3" text-anchor="middle" class="infall-tag" fill="#bc8cff">Windows 11 / WSL2</text>
