        <tspan x="425" dy="16">     ████      ████   ████      ████     </tspan>
        <tspan x="425" dy="16">      ▀████▄▄████▀     ▀████▄▄████▀      </tspan>
        <tspan x="425" dy="16">        ▀▀████▀▀         ▀▀████▀▀        </tspan>
