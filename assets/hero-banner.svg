<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161b22" />
    </pattern>

    <style>
      /* LED Pulse Keyframes */
      @keyframes tick-pulse {
        0% {
          fill: #ffffff;
          opacity: 1;
          filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 14px #00ff66) drop-shadow(0 0 26px #00ff66);
        }
        4% {
          fill: #66ff99;
          opacity: 1;
          filter: drop-shadow(0 0 4px #00ff66) drop-shadow(0 0 16px #00ff66);
        }
        8% {
          fill: #00ff66;
          opacity: 1;
          filter: drop-shadow(0 0 4px #00ff66) drop-shadow(0 0 12px #00ff66);
        }
        12% {
          fill: #00dd55;
          opacity: 0.9;
          filter: drop-shadow(0 0 3px #00cc55);
        }
        16% {
          fill: #00bb44;
          opacity: 0.75;
          filter: drop-shadow(0 0 2px #009933);
        }
        20% {
          fill: #008833;
          opacity: 0.55;
          filter: none;
        }
        24% {
          fill: #005522;
          opacity: 0.35;
          filter: none;
        }
        28% {
          fill: #003311;
          opacity: 0.2;
          filter: none;
        }
        32%, 100% {
          fill: #00ff66;
          opacity: 0.07;
          filter: none;
        }
      }

      .tick {
        fill: #00ff66;
        opacity: 0.07;
      }

      .tk-0 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.000s; }
      .tk-1 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.100s; }
      .tk-2 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.200s; }
      .tk-3 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.300s; }
      .tk-4 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.400s; }
      .tk-5 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.500s; }
      .tk-6 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.600s; }
      .tk-7 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.700s; }
      .tk-8 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.800s; }
      .tk-9 { animation: tick-pulse 3.6s infinite linear; animation-delay: 0.900s; }
      .tk-10 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.000s; }
      .tk-11 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.100s; }
      .tk-12 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.200s; }
      .tk-13 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.300s; }
      .tk-14 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.400s; }
      .tk-15 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.500s; }
      .tk-16 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.600s; }
      .tk-17 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.700s; }
      .tk-18 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.800s; }
      .tk-19 { animation: tick-pulse 3.6s infinite linear; animation-delay: 1.900s; }
      .tk-20 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.000s; }
      .tk-21 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.100s; }
      .tk-22 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.200s; }
      .tk-23 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.300s; }
      .tk-24 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.400s; }
      .tk-25 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.500s; }
      .tk-26 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.600s; }
      .tk-27 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.700s; }
      .tk-28 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.800s; }
      .tk-29 { animation: tick-pulse 3.6s infinite linear; animation-delay: 2.900s; }
      .tk-30 { animation: tick-pulse 3.6s infinite linear; animation-delay: 3.000s; }
      .tk-31 { animation: tick-pulse 3.6s infinite linear; animation-delay: 3.100s; }
      .tk-32 { animation: tick-pulse 3.6s infinite linear; animation-delay: 3.200s; }
      .tk-33 { animation: tick-pulse 3.6s infinite linear; animation-delay: 3.300s; }
      .tk-34 { animation: tick-pulse 3.6s infinite linear; animation-delay: 3.400s; }
      .tk-35 { animation: tick-pulse 3.6s infinite linear; animation-delay: 3.500s; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-weight: 800;
        letter-spacing: 3.5px;
        font-size: 15px;
        fill: #e6edf3;
      }

      .sub-text {
        font-family: Consolas, "Courier New", "Fira Code", monospace;
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 600;
        fill: #8b949e;
      }

      .code-pill-font {
        font-family: Consolas, "Courier New", monospace;
        font-weight: 700;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Frameless Floating Card Surface -->
  <rect width="850" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect width="850" height="280" rx="14" fill="url(#grid-dots)" opacity="0.6" />

  <!-- Status Pill -->
  <g transform="translate(325, 244)">
    <rect width="200" height="22" rx="11" fill="#161b22" />
    <rect width="200" height="22" rx="11" fill="none" stroke="#00ff66" stroke-width="1.2" opacity="0.8" />
    <text x="100" y="15" fill="#00ff66" class="code-pill-font" text-anchor="middle" filter="drop-shadow(0 0 4px #00ff66)">while (alive) { code(); }</text>
  </g>

