<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161b22" />
    </pattern>

    <style>
      /* 4-Phase Color Cycling */
      @keyframes fade-red {
        0%, 100% { opacity: 1; }
        20%, 80% { opacity: 0; }
      }
      @keyframes fade-pink {
        0% { opacity: 0; }
        25% { opacity: 1; }
        45% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes fade-green {
        0%, 25% { opacity: 0; }
        50% { opacity: 1; }
        70% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes fade-yellow {
        0%, 50% { opacity: 0; }
        75% { opacity: 1; }
        95% { opacity: 0; }
        100% { opacity: 0; }
      }

      .layer-red { animation: fade-red 8s infinite ease-in-out; }
      .layer-pink { animation: fade-pink 8s infinite ease-in-out; }
      .layer-green { animation: fade-green 8s infinite ease-in-out; }
      .layer-yellow { animation: fade-yellow 8s infinite ease-in-out; }

      /* Glitch Master Shake (4s loop) */
      @keyframes glitch-shake {
        0%, 38%, 42%, 82%, 87%, 92%, 97%, 100% {
          transform: translate(0, 0);
        }
        /* Minor twitch at ~40% */
        39% { transform: translate(-2px, 1px); }
        40% { transform: translate(2px, -1px); }
        41% { transform: translate(-1px, 0); }
        /* Major glitch burst at 83-96% */
        83% { transform: translate(-4px, 1px); }
        84% { transform: translate(3px, -2px); }
        85% { transform: translate(-3px, 2px); }
        86% { transform: translate(4px, 0); }
        88% { transform: translate(-2px, -1px); }
        89% { transform: translate(3px, 1px); }
        90% { transform: translate(-4px, 0); }
        93% { transform: translate(2px, 1px); }
        94% { transform: translate(-1px, -1px); }
        95% { transform: translate(3px, 0); }
      }

      /* Cyan Chromatic Split */
      @keyframes glitch-cyan {
        0%, 38%, 42%, 82%, 97%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
        39% { opacity: 0.6; transform: translate(-3px, 1px); }
        40% { opacity: 0.4; transform: translate(2px, -1px); }
        41% { opacity: 0; }
        83% { opacity: 0.9; transform: translate(-6px, 2px); }
        84% { opacity: 0.3; transform: translate(4px, -1px); }
        85% { opacity: 0.85; transform: translate(-5px, -2px); }
        86% { opacity: 0.2; transform: translate(3px, 1px); }
        88% { opacity: 0.95; transform: translate(-6px, 1px); }
        89% { opacity: 0; }
        90% { opacity: 0.75; transform: translate(-4px, -1px); }
        93% { opacity: 0.9; transform: translate(5px, 1px); }
        94% { opacity: 0.3; transform: translate(-3px, 0); }
        95% { opacity: 0.8; transform: translate(-4px, 1px); }
        96% { opacity: 0; }
      }

      /* Magenta Chromatic Split */
      @keyframes glitch-magenta {
        0%, 38%, 42%, 82%, 97%, 100% {
          opacity: 0;
          transform: translate(0, 0);
        }
        39% { opacity: 0.5; transform: translate(3px, -1px); }
        40% { opacity: 0.3; transform: translate(-2px, 1px); }
        41% { opacity: 0; }
        83% { opacity: 0.85; transform: translate(6px, -2px); }
        84% { opacity: 0.95; transform: translate(-4px, 1px); }
        85% { opacity: 0.2; transform: translate(3px, 2px); }
        86% { opacity: 0.9; transform: translate(5px, -1px); }
        88% { opacity: 0.1; transform: translate(-3px, 0); }
        89% { opacity: 0.8; transform: translate(4px, -1px); }
        90% { opacity: 0; }
        93% { opacity: 0.85; transform: translate(5px, 2px); }
        94% { opacity: 0.4; transform: translate(-3px, -1px); }
        95% { opacity: 0.85; transform: translate(5px, -1px); }
        96% { opacity: 0; }
      }

      .glitch-target {
        animation: glitch-shake 4s infinite ease-in-out;
      }

      .ghost-cyan {
        animation: glitch-cyan 4s infinite ease-in-out;
        fill: #00f0ff;
        filter: drop-shadow(0 0 6px #00f0ff) drop-shadow(0 0 14px rgba(0,240,255,0.9));
      }

      .ghost-magenta {
        animation: glitch-magenta 4s infinite ease-in-out;
        fill: #ff007f;
        filter: drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px rgba(255,0,127,0.9));
      }

      .ascii-text {
        font-family: Consolas, "Courier New", "Fira Code", monospace;
        font-size: 13.5px;
        font-weight: 700;
        white-space: pre;
      }

      .text-red {
        fill: #ff2a5f;
        filter: drop-shadow(0 0 6px #ff0055) drop-shadow(0 0 18px rgba(255, 0, 85, 0.9));
      }
      .text-pink {
        fill: #ff1493;
        filter: drop-shadow(0 0 6px #ff00bb) drop-shadow(0 0 18px rgba(255, 20, 147, 0.9));
      }
      .text-green {
        fill: #00ff66;
        filter: drop-shadow(0 0 6px #00ff66) drop-shadow(0 0 18px rgba(0, 255, 102, 0.9));
      }
      .text-yellow {
        fill: #ffe600;
        filter: drop-shadow(0 0 6px #ffe600) drop-shadow(0 0 18px rgba(255, 230, 0, 0.9));
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-weight: 800;
        letter-spacing: 3.5px;
        font-size: 15px;
        fill: #e6edf3;
      }

      .sub-text {
        font-family: Consolas, "Courier New", "Fira Code", monospace;
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 600;
        fill: #8b949e;
      }

      .code-pill-font {
        font-family: Consolas, "Courier New", monospace;
        font-weight: 700;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Frameless Floating Card Surface -->
