<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="310">
  <defs>
    <!-- Neon Linear Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="35%" stop-color="#3fb950" />
      <stop offset="70%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161b22" />
    </pattern>

    <style>
      @keyframes pulse {
        0%, 100% {
          filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.6));
        }
        50% {
          filter: drop-shadow(0 0 14px rgba(63, 185, 80, 0.8));
        }
      }
      .ascii-art {
        font-family: Consolas, "Courier New", "Fira Code", monospace;
        font-size: 13.5px;
        font-weight: 700;
        white-space: pre;
        animation: pulse 4s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-weight: 800;
        letter-spacing: 7px;
        fill: #f0f6fc;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #8b949e;
      }
      .code-pill {
        font-family: "Fira Code", monospace;
        font-weight: 600;
        font-size: 11px;
        fill: #3fb950;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="850" height="310" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect width="850" height="310" rx="12" fill="url(#grid-dots)" opacity="0.7" />

  <!-- Terminal Window Controls -->
  <circle cx="24" cy="20" r="4.5" fill="#f85149" />
  <circle cx="38" cy="20" r="4.5" fill="#e3b341" />
  <circle cx="52" cy="20" r="4.5" fill="#2ea043" />
  <text x="425" y="24" fill="#6e7681" font-family="monospace" font-size="11" text-anchor="middle">stuckinloop8@math-cs: ~</text>

  <!-- ASCII Infinity Loop -->
  <g filter="url(#neon-glow)">
    <text x="425" y="52" class="ascii-art" text-anchor="middle" fill="url(#neon-grad)" xml:space="preserve">
      <tspan x="425" dy="0">         .-----.         .-----.        </tspan>
      <tspan x="425" dy="16">       .'       '.     .'       '.      </tspan>
      <tspan x="425" dy="16">      /   .---.   \   /   .---.   \     </tspan>
      <tspan x="425" dy="16">     /   /     \   \ /   /     \   \    </tspan>
      <tspan x="425" dy="16">    |   |       |   X   |       |   |   </tspan>
      <tspan x="425" dy="16">    |   |       |  / \  |       |   |   </tspan>
      <tspan x="425" dy="16">     \   \     /  /   \  \     /   /    </tspan>
      <tspan x="425" dy="16">      \   '---'  /     \  '---'  /      </tspan>
      <tspan x="425" dy="16">       '.     .'       '.     .'        </tspan>
      <tspan x="425" dy="16">         '---'           '---'          </tspan>
    </text>
  </g>

  <!-- Typography -->
  <text x="425" y="235" class="title-text" font-size="20" text-anchor="middle">STUCKINLOOP8</text>
  <text x="425" y="258" class="sub-text" font-size="11" text-anchor="middle">
    COMPUTER SCIENCE &amp; APPLIED MATHEMATICS <tspan fill="#58a6ff">//</tspan> ASPIRING QUANT <tspan fill="#3fb950">//</tspan> UNDERGRAD
  </text>

  <!-- Code status badge -->
  <g transform="translate(325, 272)">
    <rect width="200" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="100" y="15" class="code-pill" text-anchor="middle">while (alive) { code(); }</text>
  </g>
</svg>