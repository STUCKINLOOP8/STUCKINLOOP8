<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 185" width="100%" height="185">
  <defs>
    <!-- Neon Linear Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="45%" stop-color="#3fb950" />
      <stop offset="75%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161b22" />
    </pattern>

    <style>
      @keyframes dash {
        from {
          stroke-dashoffset: 880;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      .laser-path {
        stroke-dasharray: 140 300;
        animation: dash 3.5s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-weight: 800;
        letter-spacing: 7px;
        fill: #f0f6fc;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #8b949e;
      }
      .code-pill {
        font-family: "Fira Code", monospace;
        font-weight: 600;
        font-size: 11px;
        fill: #3fb950;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="850" height="185" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect width="850" height="185" rx="12" fill="url(#grid-dots)" opacity="0.7" />

  <!-- Terminal Window Controls -->
  <circle cx="24" cy="20" r="4.5" fill="#f85149" />
  <circle cx="38" cy="20" r="4.5" fill="#e3b341" />
  <circle cx="52" cy="20" r="4.5" fill="#2ea043" />
  <text x="425" y="24" fill="#6e7681" font-family="monospace" font-size="11" text-anchor="middle">stuckinloop8@math-cs: ~</text>

  <!-- Infinity Lemniscate Loop -->
  <g filter="url(#laser-glow)">
    <!-- Base track -->
    <path d="M 425,64 C 385,25 325,25 325,64 C 325,103 385,103 425,64 C 465,25 525,25 525,64 C 525,103 465,103 425,64 Z"
          fill="none" stroke="#21262d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Animated laser beam -->
    <path class="laser-path" d="M 425,64 C 385,25 325,25 325,64 C 325,103 385,103 425,64 C 465,25 525,25 525,64 C 525,103 465,103 425,64 Z"
          fill="none" stroke="url(#neon-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center crossover pulse -->
    <circle cx="425" cy="64" r="3.2" fill="#58a6ff" />
  </g>

  <!-- Typography -->
  <text x="425" y="118" class="title-text" font-size="20" text-anchor="middle">STUCKINLOOP8</text>
  <text x="425" y="142" class="sub-text" font-size="11" text-anchor="middle">
    COMPUTER SCIENCE &amp; APPLIED MATHEMATICS <tspan fill="#58a6ff">//</tspan> ASPIRING QUANT <tspan fill="#3fb950">//</tspan> UNDERGRAD
  </text>

  <!-- Code status badge -->
  <g transform="translate(325, 154)">
    <rect width="200" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="100" y="15" class="code-pill" text-anchor="middle">while (alive) { code(); }</text>
  </g>
</svg>