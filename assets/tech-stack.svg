<svg width="880" height="192" viewBox="0 0 880 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .t-cursor {
        animation: cursorBlink 1s infinite;
        fill: #00d4ff;
      }
      .t-prompt {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
      .term-text {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.2px;
      }
      .tag-bg {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 0.8;
      }
    </style>
  </defs>

  <!-- Full Terminal Window Box -->
  <rect x="0.5" y="0.5" width="879" height="191" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Titlebar Header -->
  <path d="M0.5 8.5C0.5 4.08172 4.08172 0.5 8.5 0.5H871.5C875.918 0.5 879.5 4.08172 879.5 8.5V36.5H0.5V8.5Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="20" cy="18.5" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="36" cy="18.5" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="52" cy="18.5" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Divider -->
  <line x1="70" y1="9.5" x2="70" y2="27.5" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Command Prompt -->
  <text x="84" y="22.5" class="t-prompt">
    <tspan fill="#7ee787" font-weight="bold">$</tspan>
    <tspan fill="#f0f6fc"> cat stack.json</tspan>
    <tspan class="t-cursor" font-weight="bold"> █</tspan>
  </text>

  <!-- Right Side Status Badge -->
  <g transform="translate(748, 8.5)">
    <rect width="116" height="20" rx="10" fill="#0d1117" stroke="#238636" stroke-width="0.8"/>
    <circle cx="11" cy="10" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="21" y="14" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.4">stack: active</text>
  </g>

  <!-- Terminal Output Lines -->
  <!-- Line 1: Languages -->
  <g transform="translate(24, 62)">
    <text x="0" y="12" class="term-text" fill="#00d4ff" font-weight="700">&#x276F; LANGUAGES</text>
    <text x="140" y="12" class="term-text" fill="#8b949e">::</text>
    
    <g transform="translate(160, -3)">
      <rect x="0" width="66" height="22" rx="4" class="tag-bg"/>
      <text x="33.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">Python</text>
      <rect x="74" width="46" height="22" rx="4" class="tag-bg"/>
      <text x="97.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">C++</text>
      <rect x="128" width="40" height="22" rx="4" class="tag-bg"/>
      <text x="148.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">C</text>
      <rect x="176" width="48" height="22" rx="4" class="tag-bg"/>
      <text x="200.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">SQL</text>
      <rect x="232" width="68" height="22" rx="4" class="tag-bg"/>
      <text x="266.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">MATLAB</text>
      <rect x="308" width="96" height="22" rx="4" class="tag-bg"/>
      <text x="356.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">TypeScript</text>
      <rect x="412" width="96" height="22" rx="4" class="tag-bg"/>
      <text x="460.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">JavaScript</text>
      <rect x="516" width="82" height="22" rx="4" class="tag-bg"/>
      <text x="557.0" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">HTML/CSS</text>
    </g>
  </g>

  <!-- Line 2: Quantitative & Math -->
  <g transform="translate(24, 104)">
    <text x="0" y="12" class="term-text" fill="#00ff88" font-weight="700">&#x276F; QUANT &amp; MATH</text>
    <text x="140" y="12" class="term-text" fill="#8b949e">::</text>

    <g transform="translate(160, -3)">
      <rect x="0" width="130" height="22" rx="4" class="tag-bg"/>
      <text x="65.0" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">NumPy &amp; Pandas</text>
      <rect x="138" width="156" height="22" rx="4" class="tag-bg"/>
      <text x="216.0" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">Probability &amp; Stats</text>
      <rect x="302" width="118" height="22" rx="4" class="tag-bg"/>
      <text x="361.0" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">Linear Algebra</text>
      <rect x="428" width="160" height="22" rx="4" class="tag-bg"/>
      <text x="508.0" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">Stochastic Calculus</text>
      <rect x="596" width="46" height="22" rx="4" class="tag-bg"/>
      <text x="619.0" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">DSA</text>
    </g>
  </g>

  <!-- Line 3: Tools & Environment -->
  <g transform="translate(24, 146)">
    <text x="0" y="12" class="term-text" fill="#bc8cff" font-weight="700">&#x276F; TOOLS &amp; ENV</text>
    <text x="140" y="12" class="term-text" fill="#8b949e">::</text>

    <g transform="translate(160, -3)">
      <rect x="0" width="106" height="22" rx="4" class="tag-bg"/>
      <text x="53.0" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Git &amp; GitHub</text>
      <rect x="114" width="66" height="22" rx="4" class="tag-bg"/>
      <text x="147.0" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Docker</text>
      <rect x="188" width="74" height="22" rx="4" class="tag-bg"/>
      <text x="225.0" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">VS Code</text>
      <rect x="270" width="148" height="22" rx="4" class="tag-bg"/>
      <text x="344.0" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Jupyter Notebooks</text>
      <rect x="426" width="150" height="22" rx="4" class="tag-bg"/>
      <text x="501.0" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Windows 11 / WSL2</text>
    </g>
  </g>
</svg>