<svg width="880" height="185" viewBox="0 0 880 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .c-blink {
        animation: blinkCursor 1s infinite;
        fill: #00d4ff;
      }
      .code-font {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11.8px;
        letter-spacing: 0.25px;
      }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="0.5" y="0.5" width="879" height="184" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Titlebar Header -->
  <path d="M0.5 8.5C0.5 4.08172 4.08172 0.5 8.5 0.5H871.5C875.918 0.5 879.5 4.08172 879.5 8.5V36.5H0.5V8.5Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Control Buttons -->
  <circle cx="20" cy="18.5" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="36" cy="18.5" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="52" cy="18.5" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Divider Line -->
  <line x1="70" y1="9.5" x2="70" y2="27.5" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Command Prompt -->
  <text x="84" y="22.5" font-family="ui-monospace, monospace" font-size="13">
    <tspan fill="#7ee787" font-weight="bold">$</tspan>
    <tspan fill="#f0f6fc"> cat stack.json</tspan>
    <tspan class="c-blink" font-weight="bold"> █</tspan>
  </text>

  <!-- Right Side Status Badge -->
  <g transform="translate(748, 8.5)">
    <rect width="116" height="20" rx="10" fill="#0d1117" stroke="#238636" stroke-width="0.8"/>
    <circle cx="11" cy="10" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="21" y="14" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.4">stack: active</text>
  </g>

  <!-- JSON Stream Output -->
  <g transform="translate(30, 60)" class="code-font">
    <!-- Line 1: { -->
    <text x="0" y="0" fill="#8b949e">{</text>

    <!-- Line 2: "languages" -->
    <text x="18" y="24">
      <tspan fill="#79c0ff" font-weight="600">"languages"</tspan><tspan fill="#8b949e">: [ </tspan>
      <tspan fill="#a5d6ff">"Python"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"C++"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"C"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"SQL"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"MATLAB"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"TypeScript"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"JavaScript"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"HTML/CSS"</tspan>
      <tspan fill="#8b949e"> ],</tspan>
    </text>

    <!-- Line 3: "quant_and_math" -->
    <text x="18" y="52">
      <tspan fill="#7ee787" font-weight="600">"quant_and_math"</tspan><tspan fill="#8b949e">: [ </tspan>
      <tspan fill="#a5d6ff">"NumPy &amp; Pandas"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"Probability &amp; Stats"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"Linear Algebra"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"Stochastic Calculus"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"DSA"</tspan>
      <tspan fill="#8b949e"> ],</tspan>
    </text>

    <!-- Line 4: "systems_and_tools" -->
    <text x="18" y="80">
      <tspan fill="#d2a8ff" font-weight="600">"systems_and_tools"</tspan><tspan fill="#8b949e">: [ </tspan>
      <tspan fill="#a5d6ff">"Docker"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"Git &amp; GitHub"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"VS Code"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"Jupyter Notebooks"</tspan><tspan fill="#8b949e">, </tspan>
      <tspan fill="#a5d6ff">"Windows 11 / WSL2"</tspan>
      <tspan fill="#8b949e"> ]</tspan>
    </text>

    <!-- Line 5: } -->
    <text x="0" y="104" fill="#8b949e">}</text>
  </g>
</svg>