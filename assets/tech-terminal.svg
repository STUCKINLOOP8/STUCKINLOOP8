<svg width="880" height="192" viewBox="0 0 880 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .t-cursor {
        animation: cursorBlink 1s infinite;
        fill: #00d4ff;
      }
      .t-prompt {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
      .term-text {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12.5px;
        letter-spacing: 0.3px;
      }
      .tag-bg {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 0.8;
      }
    </style>
  </defs>

  <!-- Full Terminal Window Box -->
  <rect x="0.5" y="0.5" width="879" height="191" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Titlebar Header -->
  <path d="M0.5 8.5C0.5 4.08172 4.08172 0.5 8.5 0.5H871.5C875.918 0.5 879.5 4.08172 879.5 8.5V36.5H0.5V8.5Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="20" cy="18.5" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="36" cy="18.5" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="52" cy="18.5" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Divider -->
  <line x1="70" y1="9.5" x2="70" y2="27.5" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Command Prompt -->
  <text x="84" y="22.5" class="t-prompt">
    <tspan fill="#7ee787" font-weight="bold">$</tspan>
    <tspan fill="#f0f6fc"> neofetch --specs --tech-stack</tspan>
    <tspan class="t-cursor" font-weight="bold"> █</tspan>
  </text>

  <!-- Right Side Status Badge -->
  <g transform="translate(748, 8.5)">
    <rect width="116" height="20" rx="10" fill="#0d1117" stroke="#238636" stroke-width="0.8"/>
    <circle cx="11" cy="10" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="21" y="14" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.4">specs: active</text>
  </g>

  <!-- Terminal Output Lines -->
  <!-- Line 1: Languages -->
  <g transform="translate(24, 62)">
    <text x="0" y="12" class="term-text" fill="#00d4ff" font-weight="700">❯ LANGUAGES</text>
    <text x="140" y="12" class="term-text" fill="#8b949e">::</text>
    
    <!-- Badges -->
    <g transform="translate(160, -3)">
      <!-- Python -->
      <rect x="0" width="62" height="22" rx="4" class="tag-bg"/>
      <text x="31" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">Python</text>

      <!-- C++ -->
      <rect x="70" width="48" height="22" rx="4" class="tag-bg"/>
      <text x="94" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">C++</text>

      <!-- SQL -->
      <rect x="126" width="46" height="22" rx="4" class="tag-bg"/>
      <text x="149" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">SQL</text>

      <!-- Bash -->
      <rect x="180" width="52" height="22" rx="4" class="tag-bg"/>
      <text x="206" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">Bash</text>

      <!-- JavaScript -->
      <rect x="240" width="88" height="22" rx="4" class="tag-bg"/>
      <text x="284" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">JavaScript</text>

      <!-- HTML/CSS -->
      <rect x="336" width="84" height="22" rx="4" class="tag-bg"/>
      <text x="378" y="15" class="term-text" fill="#58a6ff" text-anchor="middle" font-weight="600">HTML/CSS</text>
    </g>
  </g>

  <!-- Line 2: Quantitative & ML -->
  <g transform="translate(24, 104)">
    <text x="0" y="12" class="term-text" fill="#00ff88" font-weight="700">❯ QUANT &amp; ML</text>
    <text x="140" y="12" class="term-text" fill="#8b949e">::</text>

    <g transform="translate(160, -3)">
      <!-- NumPy -->
      <rect x="0" width="64" height="22" rx="4" class="tag-bg"/>
      <text x="32" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">NumPy</text>

      <!-- Pandas -->
      <rect x="72" width="64" height="22" rx="4" class="tag-bg"/>
      <text x="104" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">Pandas</text>

      <!-- Backtesting -->
      <rect x="144" width="94" height="22" rx="4" class="tag-bg"/>
      <text x="191" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">Backtesting</text>

      <!-- Stats & Prob -->
      <rect x="246" width="168" height="22" rx="4" class="tag-bg"/>
      <text x="330" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">Probability &amp; Stats</text>

      <!-- DSA -->
      <rect x="422" width="48" height="22" rx="4" class="tag-bg"/>
      <text x="446" y="15" class="term-text" fill="#7ee787" text-anchor="middle" font-weight="600">DSA</text>
    </g>
  </g>

  <!-- Line 3: Environment & Systems -->
  <g transform="translate(24, 146)">
    <text x="0" y="12" class="term-text" fill="#bc8cff" font-weight="700">❯ SYSTEMS &amp; ENV</text>
    <text x="140" y="12" class="term-text" fill="#8b949e">::</text>

    <g transform="translate(160, -3)">
      <!-- Linux -->
      <rect x="0" width="108" height="22" rx="4" class="tag-bg"/>
      <text x="54" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Linux (Ubuntu)</text>

      <!-- Windows 11 -->
      <rect x="116" width="94" height="22" rx="4" class="tag-bg"/>
      <text x="163" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Windows 11</text>

      <!-- Neovim -->
      <rect x="218" width="66" height="22" rx="4" class="tag-bg"/>
      <text x="251" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Neovim</text>

      <!-- VS Code -->
      <rect x="292" width="76" height="22" rx="4" class="tag-bg"/>
      <text x="330" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">VS Code</text>

      <!-- Cursor -->
      <rect x="376" width="64" height="22" rx="4" class="tag-bg"/>
      <text x="408" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Cursor</text>

      <!-- Git -->
      <rect x="448" width="46" height="22" rx="4" class="tag-bg"/>
      <text x="471" y="15" class="term-text" fill="#d2a8ff" text-anchor="middle" font-weight="600">Git</text>
    </g>
  </g>
</svg>