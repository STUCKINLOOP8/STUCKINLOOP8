<svg width="880" height="38" viewBox="0 0 880 38" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink {
        animation: blinkCursor 1s infinite;
      }
    </style>
  </defs>

  <!-- Terminal Top Bar Window -->
  <rect x="0.5" y="0.5" width="879" height="37" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="20" cy="19" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="36" cy="19" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="52" cy="19" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Divider -->
  <line x1="70" y1="10" x2="70" y2="28" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Command Prompt -->
  <text x="84" y="23" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="0.3">
    <tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#f0f6fc"> git log --contributions --snake</tspan>
    <tspan fill="#00ff88" font-weight="bold" class="cursor-blink"> █</tspan>
  </text>

  <!-- Right Side Status Badge -->
  <g transform="translate(775, 10)">
    <rect width="90" height="18" rx="9" fill="#0d1117" stroke="#238636" stroke-width="0.8"/>
    <circle cx="10" cy="9" r="3" fill="#238636">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="13" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.5">main: active</text>
  </g>
</svg>
